{% extends "auth/layout.html" %}
{% import "_macros.html" as ui %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<form class="form" method="post" action="{{ url_for('auth.login') }}">
  {{ ui.csrf() }}
  <input type="hidden" name="next" value="{{ next_url }}">
  <div class="field">
    <label for="email">E-Mail</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="hint"><a href="{{ url_for('auth.forgot_password') }}">Passwort vergessen?</a></div>
  </div>
  <button class="btn block" type="submit">Anmelden</button>
</form>
{% endblock %}
{% block foot %}
{% if allow_registration %}Noch kein Konto? <a href="{{ url_for('auth.register') }}">Jetzt kostenlos registrieren</a>{% endif %}
{% endblock %}
